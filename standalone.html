      for (const c of this.world.currents) if (c.x1 > L && c.x0 < Rr) this.bg.drawCurrent(ctx3, c, this.t);
      for (const r of this.world.rocks) if (r.x > L && r.x < Rr) r.render(ctx3);
      for (const p of this.world.plankton) if (!p.dead && p.x > L && p.x < Rr) p.render(ctx3);
      for (const j of this.jellies) j.render(ctx3, this.t);
      for (const s of this.seals) s.render(ctx3, this.t);
      for (const b of this.boats) b.render(ctx3, this.t, this.player.caught === b);
      if (this.player) this.player.render(ctx3, this.t);
      this.particles.render(ctx3);
      if (this.world.goal > L && this.world.goal < Rr + 400) this.drawGoal(ctx3);
      ctx3.restore();
    }
    drawGoal(ctx3) {
      const gx = this.world.goal, top = WATER.surfaceBand, bot = REF_H - WATER.seabedBand;
      ctx3.save();
      const g = ctx3.createLinearGradient(gx, top, gx, bot);
      g.addColorStop(0, rgba(PALETTE.amberSoft, 0));
      g.addColorStop(0.5, rgba(PALETTE.amberSoft, 0.22));
      g.addColorStop(1, rgba(PALETTE.amber, 0));
      ctx3.fillStyle = g;
      ctx3.fillRect(gx - 80, top, 240, bot - top);
      for (let i = 0; i < 5; i++) {
        ctx3.fillStyle = rgba(PALETTE.amberSoft, 0.5);
        ctx3.beginPath();
        ctx3.arc(gx + 30 + Math.sin(this.t + i) * 20, top + 60 + i * (bot - top) / 5, 4, 0, TAU);
        ctx3.fill();
      }
      ctx3.restore();
    }
    renderMenuWorld(ctx3, view2) {
      this.worldXform(ctx3, { ...view2 });
      const cx = this.camX + view2.worldViewW * 0.5;
      const cy = REF_H * 0.52 + Math.sin(this.menuFlap * 0.7) * 18;
      ctx3.save();
      ctx3.translate(cx, cy);
      ctx3.rotate(Math.sin(this.menuFlap * 0.5) * 0.06);
      drawSunfish(ctx3, 64, this.t, { flap: this.menuFlap, blink: 1, lookX: 1 });
      ctx3.restore();
      this.particles.render(ctx3);
      ctx3.restore();
    }
    // ---- HUD ----
    renderHUD(ctx3, view2) {
      const { w, scale } = view2;
      const pad = 14 * Math.max(1, scale * 0.7);
      const pl = this.player;
      if (!pl) return;
      for (let i = 0; i < pl.maxHp; i++) this.drawHeart(ctx3, pad + i * 30, pad + 12, 11, i < pl.hp);
      ctx3.font = FONT(18);
      ctx3.textAlign = "right";
      ctx3.textBaseline = "middle";
      ctx3.fillStyle = PALETTE.amber;
      ctx3.beginPath();
      ctx3.arc(w - pad - 70, pad + 12, 7, 0, TAU);
      ctx3.fill();
      ctx3.fillStyle = PALETTE.foam;
      ctx3.fillText(`${this.runPlankton}`, w - pad, pad + 12);
      this.drawProgress(ctx3, view2);
      if (this.stats().dashLevel > 0) {
        const r = 16, dx = pad + r, dy = view2.h - pad - r;
        ctx3.strokeStyle = rgba(PALETTE.foam, 0.4);
        ctx3.lineWidth = 3;
        ctx3.beginPath();
        ctx3.arc(dx, dy, r, 0, TAU);
        ctx3.stroke();
        const ready = 1 - clamp(pl.dashCD / 1.05, 0, 1);
        ctx3.strokeStyle = ready >= 1 ? PALETTE.amber : rgba(PALETTE.amberSoft, 0.7);
        ctx3.beginPath();
        ctx3.arc(dx, dy, r, -Math.PI / 2, -Math.PI / 2 + ready * TAU);
        ctx3.stroke();
        ctx3.fillStyle = rgba(PALETTE.foam, 0.8);
        ctx3.font = FONT(9);
        ctx3.textAlign = "center";
        ctx3.textBaseline = "middle";
        ctx3.fillText("DASH", dx, dy);
      }
      if (this.banner) {
        const a = clamp(this.banner.life, 0, 1) * clamp(2.6 - this.banner.life, 0, 1);
        ctx3.globalAlpha = clamp(a + 0.2, 0, 1);
        wobblyText(ctx3, this.banner.text, w / 2, view2.h * 0.26, 30, PALETTE.foam, 5);
        ctx3.globalAlpha = 1;
      }
      if (pl.caught) {
        ctx3.globalAlpha = 0.5 + 0.5 * Math.sin(this.t * 10);
        wobblyText(ctx3, STR.caught, w / 2, view2.h * 0.34, 26, "#ffd36b", 9);
        ctx3.globalAlpha = 1;
        ctx3.font = FONT(15);
        ctx3.textAlign = "center";
        ctx3.fillStyle = PALETTE.foam;
        ctx3.fillText(STR.struggle, w / 2, view2.h * 0.4);
        const bw = Math.min(260, w * 0.5), bx = (w - bw) / 2, by = view2.h * 0.44;
        ctx3.fillStyle = rgba("#000", 0.4);
        roundRect(ctx3, bx, by, bw, 12, 6);
        ctx3.fill();
        ctx3.fillStyle = "#e2604f";
        roundRect(ctx3, bx, by, bw * clamp(pl.haul, 0, 1), 12, 6);
        ctx3.fill();
        ctx3.fillStyle = PALETTE.amber;
        roundRect(ctx3, bx, by + 16, bw * clamp(pl.escape, 0, 1), 8, 4);
        ctx3.fill();
      }
    }
    drawHeart(ctx3, x, y, s, full) {
      ctx3.save();
      ctx3.translate(x, y);
      ctx3.beginPath();
      ctx3.moveTo(0, s * 0.35);
      ctx3.bezierCurveTo(-s, -s * 0.6, -s * 0.5, -s * 1.1, 0, -s * 0.45);
      ctx3.bezierCurveTo(s * 0.5, -s * 1.1, s, -s * 0.6, 0, s * 0.35);
      ctx3.closePath();
      ctx3.fillStyle = full ? "#e2604f" : "rgba(255,255,255,0.12)";
      ctx3.fill();
      ctx3.strokeStyle = PALETTE.ink;
      ctx3.lineWidth = 2;
      ctx3.stroke();
      ctx3.restore();
    }
    drawProgress(ctx3, view2) {
      const { w } = view2;
      const bw = Math.min(360, w * 0.5), bx = (w - bw) / 2, by = 20;
      ctx3.font = FONT(10);
      ctx3.textAlign = "left";
      ctx3.textBaseline = "middle";
      ctx3.fillStyle = rgba(PALETTE.foam, 0.8);
      ctx3.fillText(STR.goalAtlantic, bx - 4, by - 10);
      ctx3.textAlign = "right";
      ctx3.fillText(STR.goalPacific, bx + bw + 4, by - 10);
      ctx3.fillStyle = rgba("#06243a", 0.55);
      roundRect(ctx3, bx, by, bw, 9, 4);
      ctx3.fill();
      const g = ctx3.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, "#2e7d8a");
      g.addColorStop(1, PALETTE.amber);
      const f = clamp((this.player ? this.player.x : 0) / this.world.goal, 0, 1);
      ctx3.fillStyle = g;
      roundRect(ctx3, bx, by, bw * f, 9, 4);
      ctx3.fill();
      ctx3.save();
      ctx3.translate(bx + bw * f, by + 4.5);
      ctx3.scale(0.16, 0.16);
      drawSunfish(ctx3, 40, this.t, { flap: this.menuFlap * 3, blink: 1, lookX: 1 });
      ctx3.restore();
    }
    // ---- screens ----
    panel(ctx3, view2, h) {
      const { w } = view2;
      const pw = Math.min(560, w * 0.92), px = (w - pw) / 2, py = (view2.h - h) / 2;
      ctx3.fillStyle = rgba("#0a2236", 0.82);
      roundRect(ctx3, px, py, pw, h, 18);
      ctx3.fill();
      ctx3.strokeStyle = rgba(PALETTE.foam, 0.25);
      ctx3.lineWidth = 2;
      ctx3.stroke();
      return { px, py, pw };
    }
    button(ctx3, id, x, y, w, h, label, enabled = true, accent = false) {
      this._buttons.push({ id, x, y, w, h });
      ctx3.fillStyle = enabled ? accent ? rgba(PALETTE.amber, 0.92) : rgba("#2e6f80", 0.95) : "rgba(120,120,120,0.3)";
      roundRect(ctx3, x, y, w, h, 10);
      ctx3.fill();
      ctx3.strokeStyle = PALETTE.ink;
      ctx3.lineWidth = 2.5;
      ctx3.stroke();
      ctx3.fillStyle = enabled ? accent ? "#3a2a10" : PALETTE.foam : "rgba(255,255,255,0.5)";
      ctx3.font = FONT(15, "800");
      ctx3.textAlign = "center";
      ctx3.textBaseline = "middle";
      ctx3.fillText(label, x + w / 2, y + h / 2 + 1);
    }
    renderMenu(ctx3, view2) {
      const { w, h } = view2;
      ctx3.textAlign = "center";
      wobblyText(ctx3, STR.title, w / 2, h * 0.2, Math.min(72, w * 0.13), PALETTE.foam, 2);
      ctx3.font = FONT(18, "600");
      ctx3.fillStyle = PALETTE.amberSoft;
      ctx3.textBaseline = "middle";
      ctx3.fillText(STR.subtitle, w / 2, h * 0.2 + Math.min(58, w * 0.1));
      ctx3.font = FONT(14, "500");
      ctx3.fillStyle = rgba(PALETTE.foam, 0.8);
      ctx3.fillText(STR.tagline, w / 2, h * 0.72);
      ctx3.globalAlpha = 0.6 + 0.4 * Math.sin(this.t * 2.5);
      ctx3.font = FONT(17, "700");
      ctx3.fillStyle = PALETTE.foam;
      ctx3.fillText(STR.tapToStart, w / 2, h * 0.8);
      ctx3.globalAlpha = 1;
      ctx3.font = FONT(12, "500");
      ctx3.fillStyle = rgba(PALETTE.foam, 0.6);
      ctx3.fillText(STR.dragHint + "  \xB7  " + STR.keyHint, w / 2, h * 0.86);
      ctx3.font = FONT(13, "600");
      ctx3.fillStyle = PALETTE.amberSoft;
      ctx3.fillText(`${STR.shopBanked}: ${this.save.plankton} ${STR.hudPlankton}   \xB7   ${STR.hudBest}: ${Math.round(this.save.best / 40)} leagues`, w / 2, h * 0.92);
      this.button(ctx3, "shop", w / 2 - 130, h * 0.55, 120, 42, "\u2693 " + STR.toShop);
      this.button(ctx3, "mute", w / 2 + 10, h * 0.55, 120, 42, Audio.isMuted() ? "\u{1F507} " + STR.muted : "\u{1F50A} " + STR.unmuted);
    }
    renderShop(ctx3, view2) {
      const { w } = view2;
      const ph = Math.min(440, view2.h * 0.9);
      const { px, py, pw } = this.panel(ctx3, view2, ph);
      ctx3.textAlign = "center";
      ctx3.textBaseline = "middle";
      wobblyText(ctx3, STR.shopTitle, w / 2, py + 34, 26, PALETTE.foam, 3);
      ctx3.font = FONT(12, "500");
      ctx3.fillStyle = rgba(PALETTE.foam, 0.75);
      ctx3.fillText(STR.shopBlurb, w / 2, py + 60);
      ctx3.fillStyle = PALETTE.amber;
      ctx3.font = FONT(15, "800");
      ctx3.fillText(`${this.save.plankton} ${STR.hudPlankton} ${STR.shopBanked}`, w / 2, py + 84);
      const rowH = (ph - 150) / UPGRADES.length;
      UPGRADES.forEach((u, i) => {
        const ry = py + 104 + i * rowH;
        const lvl = this.save.upg[u.id] || 0;
        const maxed = lvl >= u.max;
        const cost = u.baseCost + u.step * lvl;
        ctx3.textAlign = "left";
        ctx3.textBaseline = "middle";
        ctx3.font = FONT(15, "800");
        ctx3.fillStyle = PALETTE.foam;
        ctx3.fillText(u.name, px + 24, ry + 12);
        ctx3.font = FONT(11, "500");
        ctx3.fillStyle = rgba(PALETTE.foam, 0.7);
        ctx3.fillText(u.desc, px + 24, ry + 30);
        for (let k = 0; k < u.max; k++) {
          ctx3.fillStyle = k < lvl ? PALETTE.amber : "rgba(255,255,255,0.18)";
          ctx3.beginPath();
          ctx3.arc(px + 24 + k * 16, ry + 44, 5, 0, TAU);
          ctx3.fill();
        }
        const bx = px + pw - 132;
        if (maxed) {
          ctx3.fillStyle = rgba(PALETTE.amberSoft, 0.8);
          ctx3.font = FONT(14, "800");
          ctx3.textAlign = "center";
          ctx3.fillText(STR.shopMaxed, bx + 54, ry + 24);
        } else {
          this.button(
            ctx3,
            "buy:" + u.id,
            bx,
            ry + 4,
            108,
            38,
            `${cost} \u2618`,
            this.save.plankton >= cost,
            this.save.plankton >= cost
          );
        }
      });
      this.button(ctx3, "back", px + pw / 2 - 55, py + ph - 46, 110, 36, "\u2039 " + STR.shopBack);
    }
    renderWin(ctx3, view2) {
      const { w, h } = view2;
      ctx3.fillStyle = rgba("#06243a", 0.5);
      ctx3.fillRect(0, 0, w, h);
      wobblyText(ctx3, STR.win, w / 2, h * 0.26, Math.min(56, w * 0.1), PALETTE.amberSoft, 4);
      ctx3.textAlign = "center";
      ctx3.textBaseline = "middle";
      ctx3.font = FONT(16, "600");
      ctx3.fillStyle = PALETTE.foam;
      ctx3.fillText(STR.winSub, w / 2, h * 0.37);
      ctx3.font = FONT(22, "800");
      ctx3.fillStyle = PALETTE.amber;
      ctx3.fillText(STR.eggsLaid(this.eggs), w / 2, h * 0.47);
      ctx3.font = FONT(13, "500");
      ctx3.fillStyle = rgba(PALETTE.foam, 0.8);
      ctx3.fillText(STR.winFunFact, w / 2, h * 0.55);
      ctx3.fillText(`+${this.runPlankton} ${STR.hudPlankton}`, w / 2, h * 0.61);
      this.button(ctx3, "retry", w / 2 - 130, h * 0.7, 120, 44, "\u21BA " + STR.retry, true, true);
      this.button(ctx3, "shop", w / 2 + 10, h * 0.7, 120, 44, "\u2693 " + STR.toShop);
    }
    renderDead(ctx3, view2) {
      const { w, h } = view2;
      ctx3.fillStyle = rgba("#1a0d12", 0.5);
      ctx3.fillRect(0, 0, w, h);
      wobblyText(ctx3, STR.deathTitle, w / 2, h * 0.28, Math.min(48, w * 0.09), "#e8a0a0", 7);
      ctx3.textAlign = "center";
      ctx3.textBaseline = "middle";
      ctx3.font = FONT(17, "600");
      ctx3.fillStyle = PALETTE.foam;
      ctx3.fillText(this.deathMsg, w / 2, h * 0.4);
      ctx3.font = FONT(13, "500");
      ctx3.fillStyle = rgba(PALETTE.foam, 0.7);
      ctx3.fillText("\u{1F41F} " + this.funFact, w / 2, h * 0.48);
      ctx3.font = FONT(14, "700");
      ctx3.fillStyle = PALETTE.amberSoft;
      ctx3.fillText(`+${this.runPlankton} ${STR.hudPlankton} banked   \xB7   ${STR.hudBest}: ${Math.round(this.save.best / 40)} leagues`, w / 2, h * 0.55);
      this.button(ctx3, "retry", w / 2 - 130, h * 0.66, 120, 44, "\u21BA " + STR.retry, true, true);
      this.button(ctx3, "shop", w / 2 + 10, h * 0.66, 120, 44, "\u2693 " + STR.toShop);
    }
    entityCount() {
      return (this.seals ? this.seals.length : 0) + (this.boats ? this.boats.length : 0) + (this.jellies ? this.jellies.length : 0);
    }
  };

  // js/main.js
  var canvas = document.getElementById("c");
  var ctx2 = canvas.getContext("2d", { alpha: false });
  var devEl = document.getElementById("dev");
  var game = new Game();
  var view = { w: 0, h: 0, scale: 1, camX: 0, worldViewW: 0 };
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    view.w = window.innerWidth;
    view.h = window.innerHeight;
    canvas.width = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width = view.w + "px";
    canvas.style.height = view.h + "px";
    ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    view.scale = view.h / REF_H;
    view.worldViewW = view.w / view.scale;
  }
  addEventListener("resize", resize);
  addEventListener("orientationchange", resize);
  resize();
  Input.init(canvas);
  var unlock = () => Audio.unlock();
  addEventListener("pointerdown", unlock, { once: true });
  addEventListener("keydown", unlock, { once: true });
  var paused = false;
  addEventListener("blur", () => {
    paused = true;
  });
  addEventListener("focus", () => {
    paused = false;
    last = performance.now();
  });
  document.addEventListener("visibilitychange", () => {
    paused = document.hidden;
    if (!paused) last = performance.now();
  });
  var dev = new URLSearchParams(location.search).has("dev");
  if (dev) devEl.style.display = "block";
  var acc = 0;
  var last = performance.now();
  var frames = 0;
  var fpsAt = last;
  var fps = 0;
  var stepSec = STEP / 1e3;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused) {
      last = now;
      return;
    }
    let dtMs = now - last;
    last = now;
    if (dtMs > 250) dtMs = 250;
    const nowSec = now / 1e3;
    Input.update(nowSec);
    Audio.update(dtMs / 1e3);
    acc += dtMs;
    let steps = 0;
    while (acc >= STEP && steps < 5) {
      game.update(stepSec, nowSec);
      acc -= STEP;
      steps++;
    }
    if (steps === 5) acc = 0;
    game.render(ctx2, view);
    if (dev) {
      frames++;
      if (now - fpsAt >= 500) {
        fps = Math.round(frames * 1e3 / (now - fpsAt));
        frames = 0;
        fpsAt = now;
      }
      devEl.textContent = `${fps} fps \xB7 ${game.state} \xB7 ent ${game.entityCount?.() ?? 0}`;
    }
  }
  requestAnimationFrame(frame);
  window.__sunfish = game;
})();

</script>
<script>var b=document.getElementById("boot");if(b)b.remove();</script>
