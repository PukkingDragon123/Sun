      this.layBaseEggs = ECONOMY.layBase + this.runPlankton * ECONOMY.planktonMul + this.player.hp * ECONOMY.healthMul;

      if (this.nurse) this.nurse.beginLayHeal(this.player, this.particles);
    }
    layEggsAt(effort) {
      return Math.round(this.layBaseEggs * (0.5 + 0.5 * clamp(effort, 0, 1)) * this.layRoeMul);
    }
    updateLaying(dt) {
      this.layT += dt;
      const pl = this.player;
      pl.vx *= 0.92;
      pl.vy *= 0.92;
      pl.mouth = 0.4;
      const dur = ECONOMY.layDuration;
      let drive = 0;
      if (Input.active) drive = clamp(Input.speed / 900, 0, 1.4);
      const dm = Math.hypot(Input.dir.x, Input.dir.y);
      if (dm > drive) drive = dm;
      this.effort += drive * ECONOMY.effortPerInput * 60 * dt;
      if (Input.anyJustPressed()) this.effort += 0.06;
      this.effort -= ECONOMY.effortDrainPerSec * dt;
      this.effort = clamp(this.effort, 0, 1);
      this.eggsTarget = this.layEggsAt(this.effort);
      this.layCount = Math.round(lerp(this.layCount, this.eggsTarget, clamp(dt * 4, 0, 1)));
      const eggRate = 0.3 + this.effort * 0.9;
      if (Math.random() < eggRate) this.particles.spawn(pl.x - pl.r, pl.y + (Math.random() - 0.5) * pl.r, "egg", -50 - Math.random() * 70, (Math.random() - 0.5) * 70, { life: 3.8, size: 5 + Math.random() * 4 });
      if (Math.random() < 0.3 + this.effort * 0.4) this.particles.spawn(pl.x, pl.y, "sparkle", (Math.random() - 0.5) * 120, (Math.random() - 0.5) * 120, { color: PALETTE.amberSoft });
      if (this.layT >= dur && !this.layDone) {
        this.layDone = true;
        this.eggsTarget = this.layEggsAt(this.effort);
        this.layCount = this.eggsTarget;
        this.save.eggs += this.eggsTarget;
        this.save.laidTotal = (this.save.laidTotal || 0) + this.eggsTarget;
        this.save.wins = (this.save.wins || 0) + 1;
        this.save.best = this.world.goal;
        this.runBanked = true;
        this.persist();
        this.ending = this.pickEnding();
        this.state = "win";
      }
    }
    die(cause) {
      if (this.state !== "play") return;
      this.deathCause = cause;
      if (this.nurse) this.nurse.leave();
      const msgs = STR.deaths;
      const byCause = { caught: 2, squid: 10 };
      this.deathMsg = cause in byCause ? msgs[byCause[cause]] : msgs[Math.floor(Math.random() * msgs.length)];
      this.particles.burst(this.player.x, this.player.y, "blood", 32, 260);
      this.particles.burst(this.player.x, this.player.y, "gore", 9, 90);
      Audio.sea(false);
      this.reviveCost = Math.round(25 + this.checkpointRegionIdx * 22);
      this.canRevive = this.stats().wind > 0 && !this.usedWind || this.save.eggs >= this.reviveCost;
      this.state = "dying";
      this.dyingT = 0;
    }
    // the limp, sinking death — drift down to the seabed, then show the screen
    updateDying(dt) {
      this.dyingT += dt;
      const pl = this.player;
      pl.vy = Math.min(260, pl.vy + 240 * dt);
      pl.vx *= 0.95;
      pl.x += pl.vx * dt;
      pl.y += pl.vy * dt;
      pl.y = Math.min(pl.y, REF_H - WATER.seabedBand - pl.r * 0.3);
      pl.pitch = lerp(pl.pitch, 1.6, dt * 1.3);
      pl.flap += dt * 0.5;
      if (Math.random() < 0.5) this.particles.spawn(pl.x + (Math.random() - 0.5) * pl.r, pl.y, "bubble", (Math.random() - 0.5) * 30, -30);
      if (this.player.wounds.length && Math.random() < 0.4) this.particles.spawn(pl.x + (Math.random() - 0.5) * pl.r, pl.y, "blood", (Math.random() - 0.5) * 20, 24, { life: 1.4 });
      if (this.nurse) {
        this.nurse.update(dt, pl, this.particles);
        if (this.nurse.dead) this.nurse = null;
      }
      const camTarget = clamp(pl.x - this.view.worldViewW * 0.34, 0, Math.max(0, this.world.goal + 240 - this.view.worldViewW));
      this.camX = lerp(this.camX, camTarget, clamp(dt * 2, 0, 1));
      Input.takeTap();
      Input.anyJustPressed();
      if (this.dyingT > 2.6) this.state = "dead";
    }
    // intro: a hopeful egg hatches, you swim with your sibling, the sea takes them
    updateIntro(dt) {
      Input.takeTap();
      Input.anyJustPressed();
      this.introT += dt;
      if (this.introT >= 13.2) {
        Audio.unlock();
        this.beginPlay();
      }
    }
    bankRun() {
      if (this.runBanked) return;
      this.runBanked = true;
      this.save.best = Math.max(this.save.best, Math.round(this.player.x));
      const consolation = Math.floor(this.runPlankton * ECONOMY.consolationPlankton);
      this.save.eggs += consolation;
      this.runConsolation = consolation;
      this.save.runs = (this.save.runs || 0) + 1;
      this.persist();
    }
    continueRun() {
      const free = this.stats().wind > 0 && !this.usedWind;
      if (free) this.usedWind = true;
      else {
        if (this.save.eggs < this.reviveCost) {
          Audio.sfx("hurt");
          return;
        }
        this.save.eggs -= this.reviveCost;
        this.persist();
      }
      const pl = this.player;
      pl.alive = true;
      pl.hp = pl.maxHp;
      pl.caught = null;
      pl.grabbed = null;
      pl.stun = 0;
      pl.poison = 0;
      pl.parasites = 0;
      pl.slow = 0;
      pl.x = Math.max(60, this.checkpointX + 140);
      pl.y = REF_H * 0.5;
      pl.vx = 0;
      pl.vy = 0;
      pl.invuln = 2.6;
      this.clearEntities();
      this.spawnIdx = 0;
      this.spawnCD = 0;
      const sp = this.world.spawners;
      while (this.spawnIdx < sp.length && sp[this.spawnIdx].x < pl.x + 200) this.spawnIdx++;
      this.regionIdx = zoneIndexAt(pl.x);
      this.recenterCamera();
      this.banner = { text: WORLD.zones[this.regionIdx].name, life: 2.4 };
      Audio.unlock();
      Audio.sea(true);
      Audio.music(true);
      this.state = "play";
    }
    persist() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(this.save));
      } catch (e) {
      }
    }
    // ----- menu / shop / wardrobe / loot / end input ------------------------
    updateUI(dt) {
      if (this.state === "loot") this.updateLoot(dt);
      const tap = Input.takeTap();
      const key = Input.anyJustPressed();
      if (this.state === "menu") {
        if (tap) {
          const hit = this.hitButton(tap);
          if (hit === "shop") {
            this.state = "shop";
            Audio.sfx("ui");
            return;
          }
          if (hit === "wardrobe") {
            this.state = "wardrobe";
            Audio.sfx("ui");
            return;
          }
          if (hit === "loot") {
            this.openLoot();
            return;
          }
          if (hit === "mute") {
            this.save.mute = Audio.toggleMute();
            this.persist();
            return;
          }
        }
        if (tap || key) {
          Audio.unlock();
          this.startRun(true);
        }
      } else if (this.state === "shop") {
        if (tap) {
          const hit = this.hitButton(tap);
          if (hit === "back") {
            this.state = "menu";
            Audio.sfx("ui");
          } else if (hit && hit.startsWith("buy:")) this.buy(hit.slice(4));
        } else if (key) {
          this.state = "menu";
          Audio.sfx("ui");
        }
      } else if (this.state === "wardrobe") {
        if (tap) {
          const hit = this.hitButton(tap);
          if (hit === "back") {
            this.state = "menu";
            Audio.sfx("ui");
          } else if (hit === "loot") {
            this.openLoot();
          } else if (hit && hit.startsWith("equip:")) this.equip(hit.slice(6));
        } else if (key) {
          this.state = "menu";
          Audio.sfx("ui");
        }
      } else if (this.state === "loot") {
        if (tap) {
          const hit = this.hitButton(tap);
          if (hit === "back") {
            this.state = "wardrobe";
            Audio.sfx("ui");
          } else if (hit === "crack") this.crackClam();
          else if (hit === "wear" && this.loot.result) {
            this.equip(this.loot.result.skin.id);
            this.state = "wardrobe";
          }
        }
      }
    }
    updateEnd() {
      const tap = Input.takeTap();
      const key = Input.anyJustPressed();
      if (this.state === "dead" && tap) {
        const hit = this.hitButton(tap);
        if (hit === "revive") {
          this.continueRun();
          return;
        }
        if (hit === "shop") {
          this.bankRun();
          this.state = "shop";
          Audio.sfx("ui");
          return;
        }
        if (hit === "wardrobe") {
          this.bankRun();
          this.state = "wardrobe";
          Audio.sfx("ui");
          return;
        }
        this.bankRun();
        Audio.sfx("ui");
        this.state = "menu";
        return;
      }
      if (this.state === "win" && tap) {
        const hit = this.hitButton(tap);
        if (hit === "shop") {
          this.state = "shop";
          Audio.sfx("ui");
          return;
        }
        if (hit === "wardrobe") {
          this.state = "wardrobe";
          Audio.sfx("ui");
          return;
        }
        Audio.sfx("ui");
        this.state = "menu";
        return;
      }
      if (key) {
        if (this.state === "dead") this.bankRun();
        Audio.sfx("ui");
        this.state = "menu";
      }
    }
    hitButton(tap) {
      for (const b of this._buttons) if (tap.x >= b.x && tap.x <= b.x + b.w && tap.y >= b.y && tap.y <= b.y + b.h) return b.id;
      return null;
    }
    buy(id) {
      const def = UPGRADES.find((u) => u.id === id);
      if (!def) return;
      const lvl = this.save.upg[id] || 0;
      if (lvl >= def.max) return;
      const cost = def.baseCost + def.step * lvl;
      if (this.save.eggs < cost) {
        Audio.sfx("hurt");
        return;
      }
      this.save.eggs -= cost;
      this.save.upg[id] = lvl + 1;
      this.persist();
      Audio.sfx("buy");
    }
    equip(id) {
      if (!this.owns(id)) return;
      this.save.skin = id;
      if (this.player) this.player.skin = this.skinObj();
      this.persist();
      Audio.sfx("equip");
    }
    openLoot() {
      this.state = "loot";
      this.loot = { phase: "idle", t: 0, result: null, msg: null };
      Audio.sfx("ui");
    }
    updateLoot(dt) {
      const l = this.loot;
      l.t += dt;
      if (l.phase === "opening" && l.t > 1.25) {
        l.phase = "reveal";
        l.t = 0;
        Audio.sfx("reveal");
      }
    }
    crackClam() {
      const l = this.loot;
      if (l.phase === "opening") return;
      if (this.save.eggs < LOOTBOX.cost) {
        l.msg = STR.lootNeed;
        Audio.sfx("hurt");
        return;
      }
      this.save.eggs -= LOOTBOX.cost;
      l.result = this.rollSkin();
      l.phase = "opening";
      l.t = 0;
      l.msg = null;
      this.persist();
      Audio.sfx("chest");
    }
    rollSkin() {
      const keys = Object.keys(RARITY);
      let total = 0;
      for (const k of keys) total += RARITY[k].weight;
      let r = Math.random() * total, rar = keys[0];
      for (const k of keys) {
        r -= RARITY[k].weight;
        if (r <= 0) {
          rar = k;
          break;
        }
      }
      const lootable = SKINS.filter((s) => s.id !== DEFAULT_SKIN);
      let pool = lootable.filter((s) => s.rarity === rar && !this.owns(s.id));
      if (!pool.length) pool = lootable.filter((s) => !this.owns(s.id));
      let dupe = false;
      if (!pool.length) {
        pool = lootable.filter((s) => s.rarity === rar);
        dupe = true;
      }
      if (!pool.length) pool = lootable;
      const skin = pool[Math.floor(Math.random() * pool.length)];
      let refund = 0;
      if (this.owns(skin.id)) {
        dupe = true;
        refund = RARITY[skin.rarity].refund;
        this.save.eggs += refund;
      } else this.save.skins.push(skin.id);
      return { skin, dupe, refund };
    }
    // ---------------------------------------------------------------- RENDER
    render(ctx3, view2) {
      this.view = view2;
      this.view.camX = this.camX;
      const vis = this.zoneVisuals();
      this.bg.render(ctx3, { ...view2, camX: this.camX }, this.t, vis.tint, vis.dark, vis.zoneId);
      const worldState = this.state === "play" || this.state === "laying" || this.state === "dead" || this.state === "win" || this.state === "dying";
      if (worldState) this.renderWorld(ctx3, view2);
      else if (this.state !== "intro") this.renderMenuWorld(ctx3, view2);
      this._buttons = [];
      if (this.state === "menu") this.renderMenu(ctx3, view2);
      else if (this.state === "shop") this.renderShop(ctx3, view2);
      else if (this.state === "wardrobe") this.renderWardrobe(ctx3, view2);
      else if (this.state === "loot") this.renderLoot(ctx3, view2);
      else if (this.state === "intro") this.renderIntro(ctx3, view2);
      else if (this.state === "win") this.renderWin(ctx3, view2);
      else if (this.state === "dead") this.renderDead(ctx3, view2);
      else if (this.state === "dying") this.renderDyingOverlay(ctx3, view2);
      else this.renderHUD(ctx3, view2);
    }
    zoneVisuals() {
      const uiState = this.state === "menu" || this.state === "shop" || this.state === "wardrobe" || this.state === "loot";
      if (uiState || !this.world) {
        const z2 = WORLD.zones[0];
        return { tint: z2.tint, dark: 0, zoneId: z2.id };
      }
      const x = this.player ? this.player.x : 0, f = x / WORLD.goalDistance;
      let prev = WORLD.zones[0];
      for (let i = 0; i < WORLD.zones.length; i++) {
        const z2 = WORLD.zones[i];
        if (f <= z2.end) {
          const start = i === 0 ? 0 : WORLD.zones[i - 1].end;
          const tt = clamp((f - start) / (z2.end - start), 0, 1);
          return { tint: mixHex(prev.tint, z2.tint, tt), dark: lerp(prev.dark, z2.dark, tt), zoneId: z2.id };
        }
        prev = z2;
      }
      const z = WORLD.zones[WORLD.zones.length - 1];
      return { tint: z.tint, dark: z.dark, zoneId: z.id };
    }
    worldXform(ctx3, view2) {
      ctx3.save();
      ctx3.scale(view2.scale, view2.scale);
      ctx3.translate(-this.camX, 0);
    }
    // live wave surge at a world x, so kelp etc. sway in time with the push
    waveFlow(x) {
      return Math.sin(this.t * WAVE.freq + x * WAVE.swirl);
    }
    // displacement of kelp as the player swims through it (proximity × velocity)
    kelpPush(x) {
      const pl = this.player;
      if (!pl) return 0;
      const prox = clamp(1 - Math.abs(pl.x - x) / 95, 0, 1);
      return prox * clamp(pl.vx / 240, -1.3, 1.3);
    }
    renderWorld(ctx3, view2) {
      this.worldXform(ctx3, view2);
      const L = this.camX - 140, Rr = this.camX + view2.worldViewW + 140;
      const inView = (x) => x > L && x < Rr;
      for (const k of this.world.kelp) if (inView(k.x)) k.render(ctx3, this.t, this.waveFlow(k.x), this.kelpPush(k.x));
      for (const c of this.world.currents) if (c.x1 > L && c.x0 < Rr) this.bg.drawCurrent(ctx3, c, this.t);
      for (const a of this.world.anchors) if (inView(a.x)) a.render(ctx3);
      for (const r of this.world.rocks) if (inView(r.x)) r.render(ctx3);
      for (const c of this.world.corals) if (inView(c.x)) c.render(ctx3);
      for (const u of this.world.urchins) if (inView(u.x)) u.render(ctx3);
      for (const bo of this.world.boosters) if (!bo.dead && inView(bo.x)) bo.render(ctx3, this.t);
      for (const p of this.world.plankton) if (!p.dead && inView(p.x)) p.render(ctx3);
      for (const h of this.world.hooks) if (inView(h.x)) h.render(ctx3, this.t);
      for (const m of this.world.mines) if (!m.dead && inView(m.x)) m.render(ctx3, this.t);
      for (const w of this.world.whirlpools) if (inView(w.x)) w.render(ctx3, this.t);
      for (const v of this.world.vents) if (inView(v.x)) v.render(ctx3, this.t);
      for (const b of this.world.bags) if (inView(b.x)) b.render(ctx3, this.t);
      for (const j of this.jellies) j.render(ctx3, this.t);
      for (const s of this.puffers) s.render(ctx3, this.t);
      for (const c of this.copepods) c.render(ctx3, this.t);
      if (this.state === "play") {
        for (const e of this.enemies) this.drawDanger(ctx3, e);
        for (const s of this.squids) this.drawDanger(ctx3, s);
      }
      for (const e of this.enemies) e.render(ctx3, this.t);
      for (const s of this.squids) s.render(ctx3, this.t);
      for (const b of this.boats) b.render(ctx3, this.t, this.player.caught === b);
      for (const g of this.seagulls) g.render(ctx3, this.t);
      if (this.nurse) this.nurse.render(ctx3, this.t);
      if (this.player) this.player.render(ctx3, this.t);
      this.particles.render(ctx3);
      if (this.world.goal > L && this.world.goal < Rr + 400) this.drawGoal(ctx3);
      ctx3.restore();
    }
    // translucent red lane showing where a wind-up attack will land
    drawDanger(ctx3, e) {
      if (!e.telegraphing || !e.telegraphing()) return;
      const pl = this.player, bp = e.bitePoint();
      let ax = pl.x - bp.x, ay = pl.y - bp.y;
      const m = Math.hypot(ax, ay) || 1;
      ax /= m;
      ay /= m;
      const len = e.reach || 300, w = e.r * 0.6 + 18;
      const px = -ay, py = ax;
      ctx3.save();
      ctx3.globalAlpha = 0.45 + 0.3 * Math.sin(this.t * 16);
      ctx3.fillStyle = rgba(PALETTE.danger, 0.16);
      ctx3.strokeStyle = rgba(PALETTE.danger, 0.55);
      ctx3.lineWidth = 2;
      ctx3.beginPath();
      ctx3.moveTo(bp.x + px * w, bp.y + py * w);
      ctx3.lineTo(bp.x + ax * len + px * w * 0.5, bp.y + ay * len + py * w * 0.5);
      ctx3.lineTo(bp.x + ax * len - px * w * 0.5, bp.y + ay * len - py * w * 0.5);
      ctx3.lineTo(bp.x - px * w, bp.y - py * w);
      ctx3.closePath();
      ctx3.fill();
      ctx3.stroke();
      ctx3.restore();
    }
    drawGoal(ctx3) {
      const gx = this.world.goal, top = WATER.surfaceBand, bot = REF_H - WATER.seabedBand;
      ctx3.save();
      const g = ctx3.createLinearGradient(gx, top, gx, bot);
      g.addColorStop(0, rgba(PALETTE.amberSoft, 0));
      g.addColorStop(0.5, rgba(PALETTE.amberSoft, 0.22));
      g.addColorStop(1, rgba(PALETTE.amber, 0));
      ctx3.fillStyle = g;
      ctx3.fillRect(gx - 80, top, 240, bot - top);
      for (let i = 0; i < 5; i++) {
        ctx3.fillStyle = rgba(PALETTE.amberSoft, 0.5);
        ctx3.beginPath();
        ctx3.arc(gx + 30 + Math.sin(this.t + i) * 20, top + 60 + i * (bot - top) / 5, 4, 0, TAU);
        ctx3.fill();
      }
      ctx3.restore();
    }
    renderMenuWorld(ctx3, view2) {
      this.worldXform(ctx3, { ...view2 });
      if (this.state === "menu") {
        const cx = this.camX + view2.worldViewW * 0.5;
        const cy = REF_H * 0.52 + Math.sin(this.menuFlap * 0.7) * 18;
        ctx3.save();
        ctx3.translate(cx, cy);
        ctx3.rotate(Math.sin(this.menuFlap * 0.5) * 0.06);
        drawSunfish(ctx3, 64, this.t, { flap: this.menuFlap, blink: 1, lookX: 1, skin: this.skinObj() });
        ctx3.restore();
      }
      this.particles.render(ctx3);
      ctx3.restore();
    }
    // intro cutscene: a hopeful egg hatches, you swim with a sibling, the sea
    // takes them. Skippable. Drawn in screen space over the ocean backdrop.
    renderIntro(ctx3, view2) {
      const { w, h } = view2;
      const S = view2.scale;
      const T = this.introT;
      const cx = w / 2, cy = h * 0.46;
      ctx3.textAlign = "center";
      ctx3.textBaseline = "middle";
      for (let i = 0; i < 12; i++) {
        const bx = cx + Math.sin(i * 2.1) * w * 0.32;
        const by = h - (T * 28 + i * 82) % (h * 0.95);
        ctx3.fillStyle = rgba("#dff3f7", 0.16);
        ctx3.beginPath();
        ctx3.arc(bx, by, (1.3 + i % 3) * S, 0, TAU);
        ctx3.fill();
      }
      if (T < 4.6) {
        const hatch = clamp((T - 3) / 1.6, 0, 1);
        ctx3.save();
        ctx3.translate(cx, cy + Math.sin(T * 1.5) * 6 * S);
        ctx3.rotate(Math.sin(T * (3 + hatch * 6)) * 0.05 * (1 - hatch * 0.5));
        if (hatch < 1) drawEgg(ctx3, 50 * S * (1 - hatch * 0.5));
        if (hatch > 0.2) {
          ctx3.save();
          const s = 0.35 + hatch * 0.75;
          ctx3.scale(s, s);
          drawSunfish(ctx3, 34 * S, this.t, { flap: this.menuFlap * 2, blink: 1, lookX: 1, skin: this.skinObj(), sad: 0.1 });
          ctx3.restore();
        }
        ctx3.restore();
      } else {
        const loss = clamp((T - 8.4) / 1.8, 0, 1);
        const together = clamp((T - 4.6) / 1.2, 0, 1);
        const sep = (38 + together * 20) * S + Math.sin(T * 1.2) * 8 * S;
        ctx3.save();
        ctx3.translate(cx - sep, cy + Math.sin(T * 1.6) * 9 * S);
        ctx3.rotate(Math.sin(T * 1.3) * 0.08);
        drawSunfish(ctx3, 40 * S, this.t, { flap: this.menuFlap * 1.5, blink: 1, lookX: 1, skin: this.skinObj(), sad: 0.12 + loss * 0.7 });

      ctx3.textBaseline = "middle";
      wobblyText(ctx3, STR.wardrobeTitle, w / 2, py + 30, 25, PALETTE.foam, 3);
      ctx3.font = FONT(12, "500");
      ctx3.fillStyle = rgba(PALETTE.foam, 0.72);
      ctx3.fillText(`${this.save.skins.length}/${SKINS.length} found \xB7 ${STR.wardrobeBlurb}`, w / 2, py + 52);
      const cols = 4, rows = Math.ceil(SKINS.length / cols), gap = 10, padX = 22;
      const topY = py + 70, botY = py + ph - 54;
      const cellW = (pw - padX * 2 - gap * (cols - 1)) / cols;
      const cellH = (botY - topY - gap * (rows - 1)) / rows;
      const cell = Math.min(cellW, cellH);
      const gridW = cell * cols + gap * (cols - 1);
      const startX = px + (pw - gridW) / 2;
      SKINS.forEach((sk, i) => {
        const cx = startX + i % cols * (cell + gap);
        const cy = topY + Math.floor(i / cols) * (cell + gap);
        const owned = this.owns(sk.id), equipped = this.save.skin === sk.id;
        const rc = RARITY[sk.rarity].color;
        ctx3.fillStyle = rgba("#061a2a", 0.6);
        roundRect(ctx3, cx, cy, cell, cell, 10);
        ctx3.fill();
        ctx3.strokeStyle = equipped ? PALETTE.amber : rgba(rc, owned ? 0.9 : 0.3);
        ctx3.lineWidth = equipped ? 3 : 2;
        ctx3.stroke();
        if (owned) {
          ctx3.save();
          ctx3.beginPath();
          roundRect(ctx3, cx, cy, cell, cell, 10);
          ctx3.clip();
          ctx3.translate(cx + cell / 2, cy + cell * 0.52);
          const s = cell / 200;
          ctx3.scale(s, s);
          drawSunfish(ctx3, 56, this.t, { flap: this.menuFlap, blink: 1, lookX: 1, skin: sk });
          ctx3.restore();
          ctx3.font = FONT(9, "700");
          ctx3.textAlign = "center";
          ctx3.textBaseline = "middle";
          ctx3.fillStyle = equipped ? PALETTE.amber : rgba(PALETTE.foam, 0.85);
          ctx3.fillText(equipped ? STR.wardrobeEquipped : sk.name, cx + cell / 2, cy + cell - 11);
          if (!equipped) this._buttons.push({ id: "equip:" + sk.id, x: cx, y: cy, w: cell, h: cell });
        } else {
          ctx3.fillStyle = rgba(rc, 0.5);
          ctx3.font = FONT(cell * 0.4, "800");
          ctx3.textAlign = "center";
          ctx3.textBaseline = "middle";
          ctx3.fillText("?", cx + cell / 2, cy + cell / 2 - 4);
          ctx3.font = FONT(9, "600");
          ctx3.fillStyle = rgba(PALETTE.foam, 0.45);
          ctx3.fillText(RARITY[sk.rarity].label, cx + cell / 2, cy + cell - 11);
        }
      });
      this.button(ctx3, "loot", px + pw / 2 - 124, py + ph - 44, 110, 34, "\u{1F9AA} " + STR.toLoot, true, true);
      this.button(ctx3, "back", px + pw / 2 + 14, py + ph - 44, 110, 34, "\u2039 " + STR.shopBack);
    }
    renderLoot(ctx3, view2) {
      const { w } = view2;
      const ph = Math.min(440, view2.h * 0.9);
      const { px, py, pw } = this.panel(ctx3, view2, ph);
      const l = this.loot;
      ctx3.textAlign = "center";
      ctx3.textBaseline = "middle";
      wobblyText(ctx3, STR.lootTitle, w / 2, py + 34, 24, PALETTE.foam, 3);
      const ccx = w / 2, ccy = py + ph * 0.46;
      if (l.phase === "reveal" && l.result) {
        const { skin, dupe, refund } = l.result;
        const rc = RARITY[skin.rarity].color;
        const bob = Math.sin(l.t * 3) * 8;
        ctx3.save();
        ctx3.globalCompositeOperation = "lighter";
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * TAU + l.t;
          ctx3.strokeStyle = rgba(rc, 0.4);
          ctx3.lineWidth = 3;
          ctx3.beginPath();
          ctx3.moveTo(ccx + Math.cos(a) * 50, ccy + Math.sin(a) * 50);
          ctx3.lineTo(ccx + Math.cos(a) * (90 + Math.sin(l.t * 4 + i) * 12), ccy + Math.sin(a) * (90 + Math.sin(l.t * 4 + i) * 12));
          ctx3.stroke();
        }
        ctx3.restore();
        ctx3.save();
        ctx3.translate(ccx, ccy + bob);
        ctx3.scale(0.8, 0.8);
        drawSunfish(ctx3, 56, this.t, { flap: this.menuFlap, blink: 1, lookX: 1, skin });
        ctx3.restore();
        ctx3.font = FONT(13, "800");
        ctx3.fillStyle = rc;
        ctx3.fillText(RARITY[skin.rarity].label.toUpperCase(), ccx, py + ph * 0.7);
        ctx3.font = FONT(22, "800");
        ctx3.fillStyle = PALETTE.foam;
        ctx3.fillText(skin.name, ccx, py + ph * 0.76);
        ctx3.font = FONT(13, "600");
        ctx3.fillStyle = rgba(PALETTE.foam, 0.85);
        ctx3.fillText(dupe ? STR.lootDupe(refund) : STR.lootGot, ccx, py + ph * 0.82);
        const by = py + ph - 44, bw = 104, gap = 8, three = !dupe;
        const totalW = (three ? 3 : 2) * bw + (three ? 2 : 1) * gap;
        let bx = px + pw / 2 - totalW / 2;
        this.button(ctx3, "crack", bx, by, bw, 34, "\u{1F9AA} " + STR.lootAgain, this.save.eggs >= LOOTBOX.cost, true);
        bx += bw + gap;
        if (three) {
          this.button(ctx3, "wear", bx, by, bw, 34, "\u2726 " + STR.lootEquipNow, true, true);
          bx += bw + gap;
        }
        this.button(ctx3, "back", bx, by, bw, 34, "\u2039 " + STR.shopBack);
      } else {
        const opening = l.phase === "opening";
        const open = opening ? clamp((l.t - 0.55) / 0.6, 0, 1) : 0;
        const shake = opening && l.t < 0.55 ? Math.sin(l.t * 50) * 4 : 0;
        ctx3.save();
        ctx3.translate(ccx + shake, ccy + Math.sin(this.t * 2) * 5);
        ctx3.scale(1.4, 1.4);
        drawClam(ctx3, 52, open, this.t);
        ctx3.restore();
        ctx3.font = FONT(13, "500");
        ctx3.fillStyle = rgba(PALETTE.foam, 0.8);
        ctx3.fillText(STR.lootBlurb(LOOTBOX.cost), ccx, py + ph * 0.74);
        ctx3.font = FONT(14, "800");
        ctx3.fillStyle = PALETTE.amber;
        ctx3.fillText(`\u{1F95A} ${this.save.eggs.toLocaleString()} ${STR.shopBanked}`, ccx, py + ph * 0.8);
        if (l.msg) {
          ctx3.font = FONT(12, "700");
          ctx3.fillStyle = PALETTE.danger;
          ctx3.fillText(l.msg, ccx, py + ph * 0.85);
        }
        if (!opening) {
          this.button(ctx3, "crack", px + pw / 2 - 124, py + ph - 44, 130, 36, STR.lootOpen, this.save.eggs >= LOOTBOX.cost, true);
          this.button(ctx3, "back", px + pw / 2 + 24, py + ph - 44, 100, 36, "\u2039 " + STR.shopBack);
        }
      }
    }
    pickEnding() {
      const e = STR.endings;
      if (this.eggsTarget >= 300) return e.bountiful;
      if (this.runHits === 0) return e.perfect;
      if (this.player.wounds.length >= 4) return e.battered;
      return e.plain;
    }
    renderWin(ctx3, view2) {
      const { w, h } = view2;
      ctx3.fillStyle = rgba("#06243a", 0.5);
      ctx3.fillRect(0, 0, w, h);
      const end = this.ending || STR.endings.plain;
      wobblyText(ctx3, end.title, w / 2, h * 0.18, Math.min(48, w * 0.092), PALETTE.amberSoft, 4);
      ctx3.textAlign = "center";
      ctx3.textBaseline = "middle";
      ctx3.font = FONT(15, "600");
      ctx3.fillStyle = PALETTE.foam;
      wrapText(ctx3, end.line, w / 2, h * 0.28, Math.min(640, w * 0.84), 20);
      ctx3.font = FONT(23, "800");
      ctx3.fillStyle = PALETTE.amber;
      ctx3.fillText(STR.eggsLaid(this.eggsTarget), w / 2, h * 0.41);
      ctx3.font = FONT(12, "600");
      ctx3.fillStyle = rgba(PALETTE.amberSoft, 0.95);
      ctx3.fillText(STR.lifetimeEggs(this.save.laidTotal || 0), w / 2, h * 0.47);
      for (let i = 0; i < 6; i++) {
        const rise = (this.t * 16 + i * 70) % (h * 0.4);
        const bx = w / 2 + Math.sin(i * 1.7 + this.t * 0.6) * w * 0.2;
        const by = h * 0.7 - rise * 0.28;
        ctx3.save();
        ctx3.translate(bx, by);
        ctx3.scale(0.5, 0.5);
        ctx3.globalAlpha = 0.75;
        drawSunfish(ctx3, 14, this.t, { flap: this.menuFlap * 2 + i, blink: 1, lookX: 1, skin: this.skinObj() });
        ctx3.restore();
      }
      ctx3.globalAlpha = 1;
      ctx3.font = FONT(11, "800");
      ctx3.fillStyle = PALETTE.amberSoft;
      ctx3.fillText(STR.didYouKnow.toUpperCase(), w / 2, h * 0.54);
      ctx3.font = FONT(12, "500");
      ctx3.fillStyle = rgba(PALETTE.foam, 0.82);
      wrapText(ctx3, this.funFact, w / 2, h * 0.585, Math.min(640, w * 0.84), 16);
      this.button(ctx3, "retry", w / 2 - 190, h * 0.82, 116, 44, STR.retry, true, true);
      this.button(ctx3, "wardrobe", w / 2 - 58, h * 0.82, 116, 44, STR.toWardrobe);
      this.button(ctx3, "shop", w / 2 + 74, h * 0.82, 116, 44, STR.toShop);
    }
    renderDead(ctx3, view2) {
      const { w, h } = view2;
      ctx3.fillStyle = rgba("#1a0d12", 0.5);
      ctx3.fillRect(0, 0, w, h);
      wobblyText(ctx3, STR.deathTitle, w / 2, h * 0.24, Math.min(48, w * 0.09), "#e8a0a0", 7);
      ctx3.textAlign = "center";
      ctx3.textBaseline = "middle";
      ctx3.font = FONT(17, "600");
      ctx3.fillStyle = PALETTE.foam;
      ctx3.fillText(this.deathMsg, w / 2, h * 0.35);
      ctx3.font = FONT(11, "800");
      ctx3.fillStyle = PALETTE.amberSoft;
      ctx3.fillText(STR.didYouKnow.toUpperCase(), w / 2, h * 0.42);
      ctx3.font = FONT(12.5, "500");
      ctx3.fillStyle = rgba(PALETTE.foam, 0.78);
      wrapText(ctx3, this.funFact, w / 2, h * 0.46, Math.min(640, w * 0.84), 16);
      ctx3.font = FONT(13, "700");
      ctx3.fillStyle = PALETTE.amberSoft;
      const pct = Math.round(this.player.x / WORLD.goalDistance * 100);
      ctx3.fillText(`${this.runPoints.toLocaleString()} pts \xB7 +${this.runConsolation || 0} eggs \xB7 reached ${pct}% \xB7 ${WORLD.zones[this.regionIdx].name}`, w / 2, h * 0.56);
      const free = this.stats().wind > 0 && !this.usedWind;
      const canRevive = free || this.save.eggs >= this.reviveCost;
      let bx = w / 2 - (canRevive ? 250 : 125);
      if (canRevive) {
        this.button(ctx3, "revive", bx, h * 0.66, 130, 44, free ? STR.continueFree : STR.continueBtn(this.reviveCost), true, true);
        bx += 142;
      }
      this.button(ctx3, "retry", bx, h * 0.66, 116, 44, STR.retry, true, !canRevive);
      bx += 128;
      this.button(ctx3, "shop", bx, h * 0.66, 116, 44, STR.toShop);
    }
    entityCount() {
      return this.enemies.length + this.squids.length + this.puffers.length + this.jellies.length + this.boats.length + this.copepods.length + this.seagulls.length;
    }
  };

  // js/main.js
  var canvas = document.getElementById("c");
  var ctx2 = canvas.getContext("2d", { alpha: false });
  var devEl = document.getElementById("dev");
  var game = new Game();
  var view = { w: 0, h: 0, scale: 1, camX: 0, worldViewW: 0 };
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    view.w = window.innerWidth;
    view.h = window.innerHeight;
    canvas.width = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width = view.w + "px";
    canvas.style.height = view.h + "px";
    ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    view.scale = view.h / REF_H;
    view.worldViewW = view.w / view.scale;
  }
  addEventListener("resize", resize);
  addEventListener("orientationchange", resize);
  resize();
  Input.init(canvas);
  var unlock = () => Audio.unlock();
  addEventListener("pointerdown", unlock, { once: true });
  addEventListener("keydown", unlock, { once: true });
  var paused = false;
  addEventListener("blur", () => {
    paused = true;
  });
  addEventListener("focus", () => {
    paused = false;
    last = performance.now();
  });
  document.addEventListener("visibilitychange", () => {
    paused = document.hidden;
    if (!paused) last = performance.now();
  });
  var dev = new URLSearchParams(location.search).has("dev");
  if (dev) devEl.style.display = "block";
  var acc = 0;
  var last = performance.now();
  var frames = 0;
  var fpsAt = last;
  var fps = 0;
  var stepSec = STEP / 1e3;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused) {
      last = now;
      return;
    }
    let dtMs = now - last;
    last = now;
    if (dtMs > 250) dtMs = 250;
    const nowSec = now / 1e3;
    Input.update(nowSec);
    Audio.update(dtMs / 1e3);
    acc += dtMs;
    let steps = 0;
    while (acc >= STEP && steps < 5) {
      game.update(stepSec, nowSec);
      acc -= STEP;
      steps++;
    }
    if (steps === 5) acc = 0;
    game.render(ctx2, view);
    if (dev) {
      frames++;
      if (now - fpsAt >= 500) {
        fps = Math.round(frames * 1e3 / (now - fpsAt));
        frames = 0;
        fpsAt = now;
      }
      devEl.textContent = `${fps} fps \xB7 ${game.state} \xB7 ent ${game.entityCount?.() ?? 0}`;
    }
  }
  requestAnimationFrame(frame);
  window.__sunfish = game;
})();
</script>
<script>var b=document.getElementById("boot");if(b)b.remove();</script>
